name: Bug report
description: Report a reproducible problem with the template.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commands and the fixture URL or Forma placement.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, SDK version and template revision.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs or screenshots. Remove project IDs, geometry and credentials.
